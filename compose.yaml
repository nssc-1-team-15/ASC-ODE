services:
  dev:
    image: asc-ode:latest
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
      - "3100:3100"
    environment:
      HOST: 0.0.0.0
    command: ["sh", "-c", "cd docs && /opt/jupyterbook-venv/bin/jupyter book start --keep-host"]
    init: true
    stdin_open: true
    tty: true
